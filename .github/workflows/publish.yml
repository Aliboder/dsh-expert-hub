name: publish

# Publishes to npm through Trusted Publishing (OIDC): no NPM_TOKEN secret.
# Requires the package's Trusted Publisher entry on npmjs.com to name this
# repository and workflow file. Triggered by a version tag or manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Test
        run: |
          node --check index.js
          node --check client.js
          node test/run.mjs
      - name: Publish
        run: npm publish --access public
